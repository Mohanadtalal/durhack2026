name: Phase 1 camera-to-dashboard browser integration

on:
  push:
    branches: [feat/phase1-live-integration]
  pull_request:
    paths:
      - 'edge/**'
      - 'frontend/**'
      - '.github/workflows/phase1-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: ""
      GEMINI_API_KEY: ""
      API_URL: "http://127.0.0.1:8000"
      VITE_CAMERA_URL: "http://127.0.0.1:8765/stream.mjpg"
      VITE_CAMERA_MODE: "stream"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt pillow
      - run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test
          npx playwright install --with-deps chromium
      - name: Build and regression checks
        run: |
          python -m pytest backend/tests edge/tests -q
          npm --prefix frontend run build
      - name: Start API, simulated camera and dashboard
        run: |
          nohup python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > /tmp/siteguardian-api.log 2>&1 &
          nohup python -m edge.preview_demo > /tmp/siteguardian-preview.log 2>&1 &
          nohup npm --prefix frontend run dev -- --host 127.0.0.1 > /tmp/siteguardian-frontend.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8000/api/health >/dev/null && break || sleep 1; done
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8765/status.json >/dev/null && break || sleep 1; done
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break || sleep 1; done
          curl -fsS http://127.0.0.1:8000/api/health
          curl -fsS http://127.0.0.1:8765/status.json
          curl -fsS http://127.0.0.1:5173/ >/dev/null
      - name: Browser test real pointer clicks, incident and simulated MJPEG
        run: cd frontend && npx playwright test --config playwright.phase1.config.js
      - name: Collect browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-browser-failure
          path: |
            frontend/test-results/
            /tmp/siteguardian-api.log
            /tmp/siteguardian-preview.log
            /tmp/siteguardian-frontend.log
          if-no-files-found: ignore
