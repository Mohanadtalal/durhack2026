name: Full-stack smoke audit (isolated branch)
on:
  push:
    branches: [audit/full-system-smoke]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: ""
      GEMINI_API_KEY: ""
      API_URL: "http://127.0.0.1:8000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend and mock-provider test dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Install frontend and browser-test dependencies
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test
          npx playwright install --with-deps chromium
      - name: Run existing regression suite and production build
        run: |
          python -m pytest backend/tests edge/tests -q
          npm --prefix frontend run build
      - name: Start real HTTP and frontend servers
        run: |
          nohup python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > /tmp/siteguardian-api.log 2>&1 &
          nohup npm --prefix frontend run dev -- --host 127.0.0.1 > /tmp/siteguardian-ui.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8000/api/health > /dev/null && break || sleep 1; done
          curl -fsS http://127.0.0.1:8000/api/health
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:5173/ > /dev/null && break || sleep 1; done
          curl -fsS http://127.0.0.1:5173/ > /dev/null
      - name: Exercise edge -> HTTP -> storage -> stats -> Gemini error -> offline replay
        run: python -m audit.system_http_smoke
      - name: Exercise UI in Chromium
        run: cd frontend && npx playwright test --config playwright.audit.config.js
      - name: Collect audit screenshots and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siteguardian-e2e-audit
          path: |
            frontend/audit-*.png
            frontend/test-results/
            /tmp/siteguardian-api.log
            /tmp/siteguardian-ui.log
          if-no-files-found: ignore

  mongodb:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_URI: "mongodb://127.0.0.1:27017"
      MONGODB_DB: siteguardian_e2e_audit
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend test dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Test actual MongoDB persistence and event idempotency
        run: python -m audit.mongo_smoke
